<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q1</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. Canada Exodus</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-B1.webp" alt="Canada&#x27;s quiet exodus: emigrants per year since 1971" loading="lazy"><figcaption><span class="t">Chart B1 (week of Oct 25, 2026). Canada&#x27;s quiet exodus: emigrants per year since 1971</span><p>Statistics Canada estimates 112,116 emigrants in 2025/26 (July-June) and 110,914 in 2024/25, near the series high of 119,964 in 2016/17 (a one-year spike) and 70% above the 2014/15 level. Net emigration is about 62,000 a year. Fact-check: a viral X claim (via Grok) that 120,640 people left in 2025, &#x27;the highest since 1952&#x27;, does not match StatCan&#x27;s quarterly table, which sums to 111,572 for calendar 2025; StatCan&#x27;s emigration series in this table only starts in 1971, so the &#x27;1952&#x27; comparison cannot come from it. Emigration is still small next to immigration (368,224 immigrants in 2025/26, the lowest in five years).</p><p>Sources: <a href="https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000801">Statistics Canada Table 17-10-0008-01 (annual components)</a> <a href="https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710004001">Statistics Canada Table 17-10-0040-01 (quarterly)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-B7.webp" alt="Temporary residents now leave Canada faster than they arrive" loading="lazy"><figcaption><span class="t">Chart B7 (week of Oct 30, 2026). Temporary residents now leave Canada faster than they arrive</span><p>Canada&#x27;s non-permanent residents over the last four quarters: 441k arrived, 596k left (to Q2 2026). Source: Statistics Canada 17-10-0040.</p><ul><li>Q3 2023: inflows peaked at 430,470.</li><li>Q4 2024: outflows overtook inflows (179,998 vs 148,309), and they have exceeded them in 5 of the 7 quarters since.</li><li>Q4 2025: inflows were 76,983, the lowest in the series, against outflows of 156,781.</li><li>Q3 2025–Q2 2026: a net loss of about 155k temporary residents.</li></ul><p>Sources: <a href="https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710004001">Statistics Canada Table 17-10-0040</a></p></figcaption></figure></main></body></html>
