<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q9</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q9")</script></head><body><main id="issue"><h2 class="desk">Q9. German Exodus</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-B14.webp" alt="A record 288,579 Germans left Germany in 2025, and 2026 is running higher still" loading="lazy"><figcaption><span class="t">Chart B14 (week of Nov 15, 2026). A record 288,579 Germans left Germany in 2025, and 2026 is running higher still</span><p>German citizens moving out of (red/blue bars) and into (green line) Germany each year, 1954–2025, from the Federal Statistical Office (Destatis). Departures of Germans reached 288,579 in 2025, the highest since the series began, above the 281,411 of 2016; with 191,890 arrivals, Germany lost a net 96,689 of its own citizens, the largest net loss since 2016 (135,364, a method-change year). Monthly provisional data show the outflow still rising: 204,928 Germans left in January–August 2026, +5.0% on the same months of 2025, and August 2026 (32,832) was the highest single month in the 2023–2026 monthly table.</p><ul><li>Germans leaving by year: 2021 247,829; 2022 268,167; 2023 265,035; 2024 269,986; 2025 288,579.</li><li>Rolling 12 months to August 2026 on the monthly provisional basis: 304,873 departures (the monthly figures add to more than the final annual figure for 2025, so compare like with like: Jan–Aug 2026 vs Jan–Aug 2025 is +5.0%).</li><li>Opposing view on X: a widely shared reply said Germans are &#x27;fleeing desperately&#x27;; Grok&#x27;s fact-check answered that net loss was about 97,000, top destinations were Switzerland, Austria and Spain, many moves are temporary for work or retirement, and Germany still had +235,000 net migration overall.</li><li>The EADaily article frames this as a &#x27;historical record&#x27;; the Destatis table supports the record, but it also shows breaks in 2008 and 2016 when registration rules changed, which inflate departures from those years on.</li></ul><p class="nt">Note: Destatis counts registrations and deregistrations; some &#x27;departures&#x27; are ex-officio deregistrations of people who left earlier or are no longer traceable, particularly after the 2016 method change. Footnoted years (2008–2010, 2016, 2019–2025) have methodological breaks. Annual data begin in 1954 for Germans. Monthly figures for 2026 are provisional.</p><p>Sources: <a href="https://www.destatis.de/EN/Themes/Society-Environment/Population/Migration/Tables/migration-year-01.html">Destatis: migration between Germany and foreign countries, 1950–2025 (annual, Germans/non-Germans)</a> <a href="https://www.destatis.de/EN/Themes/Society-Environment/Population/Migration/Tables/migration-year-02.html">Destatis: migration by citizenship, 2020–2025</a> <a href="https://www.destatis.de/EN/Themes/Society-Environment/Population/Migration/Tables/migration-month-01.html">Destatis: monthly migration, 2023–August 2026 (provisional)</a> <a href="https://www.eadaily.com/en/news/2026/11/07/germany-has-broken-the-historical-record-for-the-number-of-indigenous-people-who-left-the-country">EADaily, Nov 7 2026: &#x27;Germany has broken the historical record&#x27; for Germans leaving</a> <a href="https://x.com/grok/status/2121667565822874095">X: Grok fact-check, &#x27;not a mass desperate flight&#x27;</a></p></figcaption></figure></main></body></html>
