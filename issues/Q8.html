<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q8</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q8")</script></head><body><main id="issue"><h2 class="desk">Q8. Who Emigrates</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-B13.webp" alt="Romanians and Bulgarians emigrate at 6x the German rate; Colombians keep leaving" loading="lazy"><figcaption><span class="t">Chart B13 (week of Nov 15, 2026). Romanians and Bulgarians emigrate at 6x the German rate; Colombians keep leaving</span><p>Citizens of each OECD or EU country who moved to another OECD country in 2024, per 1,000 residents of their home country, with the year-on-year change (country notes of the OECD International Migration Outlook 2026, published November 12 2026; population from the IMF). The highest emigration rates are in Romania (11.2 per 1,000), Bulgaria (10.1 per 1,000), Luxembourg (7.1 per 1,000), Iceland (5.7 per 1,000), Portugal (5.7 per 1,000). In absolute numbers the biggest flows were Colombians (252,000, +4%), Mexicans (227,000, +4%), Romanians (213,000, −13%), Italians (146,000, −5%) and Germans (139,000, −4%). Most European outflows fell in 2024, led by Croatia (−25%), Türkiye (−23%), Bulgaria (−19%) and Poland (−18%); rises were concentrated in Luxembourg (+10%), Israel (+8%), Japan (+5%), Netherlands (+5%), Costa Rica (+4%).</p><ul><li>Germany: 1.7 per 1,000; United Kingdom: 1.2; France: 1.6; Italy: 2.5.</li><li>Top destinations (OECD): Spain is the first destination for Colombians (67%), Italians (31%), Irish (20%), Dutch (23%), British (22%), Norwegians (21%) and Swedes (17%); Germany is first for Romanians (36%), Poles (38%), Bulgarians (43%) and Turks (48%).</li><li>The OECD figures count moves into other OECD countries only, so emigration to Gulf states, China or other non-OECD destinations is missing; the United States and New Zealand have no comparable country note.</li><li>German emigration in the OECD data (139,000 to OECD countries) is lower than Destatis&#x27; total of German citizens leaving (270,000 in 2024), because Destatis counts all destinations and all deregistrations (see B14).</li></ul><p class="nt">Note: Rates divide OECD-recorded inflows of each nationality by the home country&#x27;s total resident population (IMF), which includes foreign residents, so they slightly understate emigration per citizen. Inflow data use each destination country&#x27;s own definitions; figures are rounded by the OECD.</p><p>Sources: <a href="https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/11/international-migration-outlook-2026_3430dee0/a9eab36b-en.pdf">OECD International Migration Outlook 2026, full report PDF (country notes, Chapter 5)</a> <a href="https://www.oecd.org/en/publications/international-migration-outlook-2026_a9eab36b-en.html">OECD International Migration Outlook 2026 landing page</a> <a href="https://www.imf.org/external/datamapper/LP@WEO">IMF DataMapper: population (LP), 2024</a></p></figcaption></figure></main></body></html>
