<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. US Talent Flows</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-30-B4.webp" alt="H-1B lottery entries fell 72% from the FY2024 peak after the $100,000 fee" loading="lazy"><figcaption><span class="t">Chart B4 (week of Oct 30, 2026). H-1B lottery entries fell 72% from the FY2024 peak after the $100,000 fee</span><p>H-1B cap registrations: 759k in FY2024, 212k in FY2027 (−38.5% y/y). Source: USCIS, Oct 2026 check.</p><ul><li>FY2024: 758,994 eligible registrations, the peak.</li><li>Sep 19, 2025: a proclamation imposed a $100,000 fee on new H-1B petitions for workers abroad.</li><li>FY2027: 211,600 properly submitted registrations, down 38.5% from 343,981. It was the first wage-weighted lottery.</li><li>FY2027 selections: 71.5% held US advanced degrees, up from 57%, and 17.7% were at wage level I.</li></ul><p>Sources: <a href="https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-1b-specialty-occupations/h-1b-electronic-registration-process">USCIS, H-1B electronic registration process</a> <a href="https://www.uscis.gov/newsroom/alerts/fy-2027-h-1b-initial-registration-selection-process-completed">USCIS, FY2027 H-1B registration selection completed</a> <a href="https://www.shrm.org/topics-tools/news/talent-acquisition/uscis-reaches-fy2027-h1b-visa-cap">SHRM, USCIS reaches FY2027 H-1B cap</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-B5.webp" alt="The US foreign-student record is driven by OPT workers, not enrolment" loading="lazy"><figcaption><span class="t">Chart B5 (week of Oct 30, 2026). The US foreign-student record is driven by OPT workers, not enrolment</span><p>2024/25: 1,177,766 international students; 294,253 on OPT, while enrolled is flat since 2016/17. Source: IIE Open Doors.</p><ul><li>2016/17: 903,127 enrolled, the high point.</li><li>2024/25: 883,513 enrolled, 2% below 2016/17.</li><li>2024/25: 294,253 on OPT, a record and 25% of the total. Up from 175,695 in 2016/17.</li><li>The total is 1,177,766, up 4.5% year on year.</li></ul><p>Sources: <a href="https://opendoorsdata.org/wp-content/uploads/2025/11/Census_Overall-Enrollment-1949-2025_OD25_Website.xlsx">IIE Open Doors enrollment census 1949-2025 (xlsx)</a> <a href="https://opendoorsdata.org/annual-release/international-students/">IIE Open Doors, international students</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-B6.webp" alt="Foreign physics PhDs leaving the US nearly doubled in one year" loading="lazy"><figcaption><span class="t">Chart B6 (week of Oct 30, 2026). Foreign physics PhDs leaving the US nearly doubled in one year</span><p>Non-citizen physics PhDs abroad after graduating: 16% (2023-24) to 29% (2024-25). Source: AIP, Aug 4, 2026.</p><ul><li>2023-24 class: about 16% of non-US-citizen physics PhDs lived abroad the winter after graduating.</li><li>2024-25 class: about 29%.</li><li>US citizens: about 5% for the 2022-23 class and almost 12% for 2024-25.</li><li>Apr 2025: Nature reported US scientists&#x27; applications for jobs abroad up 32% in Jan–Mar 2025.</li></ul><p>Sources: <a href="https://www.aip.org/statistics/more-us-trained-physics-phds-are-leaving-the-us">AIP, more US-trained physics PhDs are leaving the US</a> <a href="https://www.nature.com/articles/d41586-025-01216-7">Nature news</a></p></figcaption></figure></main></body></html>
