<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q3</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q3")</script></head><body><main id="issue"><h2 class="desk">Q3. Millionaire Flows</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-B3.webp" alt="Wealth drain: projected net millionaire migration in 2025" loading="lazy"><figcaption><span class="t">Chart B3 (week of Oct 25, 2026). Wealth drain: projected net millionaire migration in 2025</span><p>Henley &amp; Partners / New World Wealth projected a record 142,000 millionaires relocating in 2025. The UK was forecast to lose a net 16,500 (after 10,800 in 2024), the biggest outflow of any country, ahead of China (-7,800) and India (-3,500), while the UAE (+9,800) and USA (+7,500) led inflows; France, Spain and Germany were also projected net losers. Strong caveat: these are commercial projections from a firm that sells residence and citizenship programmes, and critics dispute both method and scale (the counts rely on tracking wealthy individuals&#x27; stated residences, not tax or border records). Henley&#x27;s 2026 report dropped country flow forecasts, which removes the follow-up check. Shown here as a claim, not a measured flow.</p><p>Sources: <a href="https://www.henleyglobal.com/newsroom/press-releases/henley-private-wealth-migration-report-2025">Henley &amp; Partners press release, Jun 24, 2025</a></p></figcaption></figure></main></body></html>
