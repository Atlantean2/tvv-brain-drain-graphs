<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q5</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q5")</script></head><body><main id="issue"><h2 class="desk">Q5. NZ Exodus</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-B10.webp" alt="New Zealand is still losing 38,000 citizens a year, about 9x its 2016-19 average" loading="lazy"><figcaption><span class="t">Chart B10 (week of Nov 1, 2026). New Zealand is still losing 38,000 citizens a year, about 9x its 2016-19 average</span><p>Stats NZ International migration, Aug 2026 (released Oct 14, 2026). In the year to August 2026, 64,800 New Zealand citizens left long-term and 26,600 came home, a net loss of 38,200 (±450). That is barely better than 2025 (−39,900) and 2024 (−45,000). In 2016-19 net losses ran 2,700 to 7,300 a year (average about 4,300). Most departing citizens go to Australia. Non-citizen arrivals (net +58,800) still keep total migration positive.</p><p class="nt">Note: 2025-2026 are provisional (P) under the 12/16-month rule and are typically revised. The Australia destination split comes from Stats NZ release commentary, not from the table used here.</p><p>Sources: <a href="https://www.stats.govt.nz/information-releases/international-migration-august-2026/">Stats NZ, International migration: August 2026 (xlsx Table 4)</a> <a href="https://www.stats.govt.nz/news/net-migration-loss-of-new-zealand-citizens-exceeds-50000/">Stats NZ, Net migration loss of New Zealand citizens exceeds 50,000</a></p></figcaption></figure></main></body></html>
