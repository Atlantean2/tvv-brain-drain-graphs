<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Australia Exodus</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-08-B12.webp" alt="Australia still loses citizens on net, but departures are below pre-Covid" loading="lazy"><figcaption><span class="t">Chart B12 (week of Nov 8, 2026). Australia still loses citizens on net, but departures are below pre-Covid</span><p>ABS Overseas Migration, 2024-25 financial year (released 19 December 2025). These figures count Australian citizens (no visa required) who are overseas migrants under the 12/16-month rule — people who spend at least 12 months of a 16-month period overseas, or back in Australia — not country-of-birth counts and not a count of taxpayers. In 2024-25, 81.51 thousand Australian citizens departed and 64.06 thousand arrived, a net loss of -17.45 thousand. Departures were below the 2014-15 to 2018-19 average of 92.6 thousand. The net loss was smaller than in 2023-24 (-24.98 thousand) and well below the post-reopening trough of -30.47 thousand in 2022-23. During the border-closure years 2019-20 and 2020-21 the usual net loss reversed, as departures collapsed and more citizens came home.</p><ul><li>Pre-pandemic five-year averages (2014-15 to 2018-19): 92.6 thousand citizen departures, 76.6 thousand arrivals, net -16.1 thousand.</li><li>A separate ABS country-of-birth series shows a net loss of -17.06 thousand Australian-born residents in 2024-25 — close to, but not the same as, the citizen net loss, because citizenship and birthplace differ.</li><li>Total net overseas migration was still a gain of 305.6 thousand in 2024-25 (568.4 thousand arrivals minus 262.8 thousand departures), so citizen outflows sit inside a still-positive overall NOM.</li></ul><p class="nt">Note: 2024-25 estimates are preliminary. The 12/16-month overseas-migration rule differs from passenger-card &#x27;permanent&#x27; departures; ABS advises using NOM, not Overseas Arrivals and Departures, to measure migration. Citizen flows are much smaller than temporary-visa arrivals and departures.</p><p>Sources: <a href="https://www.abs.gov.au/statistics/people/population/overseas-migration/latest-release">ABS, Overseas Migration, 2024-25 financial year (latest release)</a> <a href="https://www.abs.gov.au/statistics/people/population/overseas-migration/latest-release">ABS, Graph 1.2 overseas migrant arrivals by visa and citizenship and Graph 1.3 departures</a></p></figcaption></figure></main></body></html>
