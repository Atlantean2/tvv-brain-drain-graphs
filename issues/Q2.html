<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Europe Emigration</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-B2.webp" alt="Europe&#x27;s citizens leaving home: Italy hits a record" loading="lazy"><figcaption><span class="t">Chart B2 (week of Oct 25, 2026). Europe&#x27;s citizens leaving home: Italy hits a record</span><p>Emigration of each country&#x27;s own nationals (Eurostat migr_emi1ctz, updated Sep 22, 2026). Italy lost a record 141,056 citizens in 2024, up from 114,057 in 2023 and nearly triple 2011 (50,057). Germany has run at roughly 140,000-160,000 a year since 2021 (Eurostat flags German figures as estimates). Spain&#x27;s jump in 2021 coincides with a Eurostat-flagged series break, so pre- and post-2021 Spanish values are not comparable. Greece and Portugal, the post-2010 crisis exporters, have fallen back. Counts include returning dual nationals and retirees, not only skilled workers, so &#x27;brain drain&#x27; is an upper-bound reading.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_emi1ctz/default/table">Eurostat migr_emi1ctz, emigration by citizenship</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_emi1ctz?format=JSON&amp;citizen=NAT&amp;agedef=COMPLET&amp;age=TOTAL&amp;sex=T&amp;unit=NR&amp;lang=EN">Eurostat API query used</a></p></figcaption></figure></main></body></html>
