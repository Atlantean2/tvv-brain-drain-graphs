<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Brain Drain Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Europe Emigration</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-B2.webp" alt="Europe&#x27;s citizens leaving home: Italy hits a record" loading="lazy"><figcaption><span class="t">Chart B2 (week of Oct 25, 2026). Europe&#x27;s citizens leaving home: Italy hits a record</span><p>Emigration of each country&#x27;s own nationals (Eurostat migr_emi1ctz, updated Sep 22, 2026). Italy lost a record 141,056 citizens in 2024, up from 114,057 in 2023 and nearly triple 2011 (50,057). Germany has run at roughly 140,000-160,000 a year since 2021 (Eurostat flags German figures as estimates). Spain&#x27;s jump in 2021 coincides with a Eurostat-flagged series break, so pre- and post-2021 Spanish values are not comparable. Greece and Portugal, the post-2010 crisis exporters, have fallen back. Counts include returning dual nationals and retirees, not only skilled workers, so &#x27;brain drain&#x27; is an upper-bound reading.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_emi1ctz/default/table">Eurostat migr_emi1ctz, emigration by citizenship</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_emi1ctz?format=JSON&amp;citizen=NAT&amp;agedef=COMPLET&amp;age=TOTAL&amp;sex=T&amp;unit=NR&amp;lang=EN">Eurostat API query used</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-B8.webp" alt="Italy&#x27;s young emigrants hit a record 55,700, double 2013" loading="lazy"><figcaption><span class="t">Chart B8 (week of Oct 30, 2026). Italy&#x27;s young emigrants hit a record 55,700, double 2013</span><p>Italian citizens aged 25–34 emigrating: 55,724 in 2024, up from 26,414 in 2013. Source: Eurostat migr_emi1ctz.</p><ul><li>2013: 26,414 Italians aged 25–34 emigrated.</li><li>2023: 42,216.</li><li>2024: 55,724, up 32% year on year and the series high.</li><li>2024 for the others: Germany 36,492 (estimate), Romania 32,469 (estimate), Spain 28,257.</li></ul><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_emi1ctz/default/table">Eurostat migr_emi1ctz, emigration by citizenship</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-B9.webp" alt="Ireland: Irish citizens leaving hit 35,400, the most since 2016, with no crash to blame" loading="lazy"><figcaption><span class="t">Chart B9 (week of Nov 1, 2026). Ireland: Irish citizens leaving hit 35,400, the most since 2016, with no crash to blame</span><p>CSO Population and Migration Estimates (Aug 24, 2026). In the year to April 2026, 35,400 Irish citizens emigrated. That is the most since 2016 (37,100) and 65% above 2021 (21,400), though still below the post-crash peak of 49,700 in 2012. Total emigration was 62,500. Australia (11,800) and the UK (10,600) are the top destinations. Unlike 2012, this is not a post-crash exodus. Housing costs are the most cited explanation in Irish debate, but CSO does not survey motives.</p><p class="nt">Note: CSO estimates are based on the Labour Force Survey and administrative data; they are revised when Census results arrive. Emigration counts people leaving for 12+ months.</p><p>Sources: <a href="https://data.cso.ie/table/PEA23">CSO PEA23, Estimated Emigration by Nationality</a> <a href="https://data.cso.ie/table/PEA18">CSO PEA18, Estimated Migration by Origin/Destination</a> <a href="https://www.cso.ie/en/statistics/population/populationandmigrationestimates/">CSO, Population and Migration Estimates April 2026</a></p></figcaption></figure></main></body></html>
